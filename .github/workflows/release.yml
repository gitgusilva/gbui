name: Release

# Publishes a GitHub release for a tag, with the changelog's own words.
#
# Until this existed, a tag was the whole of a release: CI built it and nothing
# else happened. The consequences were quiet ones — CHANGELOG.md links every
# version at `releases/tag/v…` and the documentation's version dropdown ends in
# "Release notes", and all of those led to an empty page. A tag is a git object;
# a release is the thing people are sent to.
#
# The notes are not written here. They are the version's section of
# CHANGELOG.md, which was written from the history and reviewed in the change
# that shipped it — see tools/release_notes.sh for why this reads that rather
# than asking for the text a second time.

on:
  push:
    tags: ["v*"]
  # For a tag that was pushed before this workflow existed, and for a second
  # attempt after a failed check. Publishing over an existing release updates it
  # rather than making a duplicate.
  workflow_dispatch:
    inputs:
      tag:
        description: "The tag to release, e.g. v0.2.1"
        required: true
        type: string

# Never cancel a release in flight: the tag is already public by the time this
# runs, and a half-published release is worse than a slow one.
concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  # ---------------------------------------------------------------------------
  # The binaries
  # ---------------------------------------------------------------------------
  #
  # One archive per platform, each holding a shared library, the headers and the
  # CMake package files — everything `find_package(gbui)` needs and nothing
  # else. Until this existed a release was a source tarball GitHub made for
  # free, which is to say: build it yourself.
  #
  # **They are built without the SDL2 backend, on purpose.** A prebuilt library
  # that links SDL2 needs the same SDL2 on the machine that loads it, and the
  # version that ships in a distribution is never the version the runner had —
  # so the one build that could be handed to a stranger is the one with nothing
  # under it. `Window::create` returns nothing in these; every other part of the
  # library, layout and paint included, is the same code. Anyone who wants a
  # window builds from source with SDL2 present, which is one command and is
  # what the installation guide already describes.
  #
  # Each archive is consumed before it is allowed out: configured, built and
  # *run* against the staged prefix. That check existed only in CI, against a
  # prefix nobody downloads, and it is what let 0.3 ship an umbrella header that
  # had stopped exporting `text`.
  package:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  label: linux-x86_64,   platform: linux-x86_64,   archive: tar.gz }
          - { os: windows-latest, label: windows-x86_64, platform: windows-x86_64, archive: zip }
          - { os: macos-latest,   label: macos-arm64,    platform: macos-arm64,    archive: tar.gz }
          # Intel Macs would be a fourth. `macos-13` is retired, and a matrix
          # entry naming a runner that no longer exists does not fail — it
          # *queues*, forever, and `needs: package` means the release never
          # publishes. Which is how 0.3.2 sat unreleased with three of its four
          # archives built and waiting. Add `macos-15-intel` when there is a
          # reason to; until then, three platforms that publish beat four that
          # might not.

    steps:
      # The tag, not the default branch — this job builds the thing being
      # released, where the job below only reads the changelog about it.
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Work out the name
        id: name
        shell: bash
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          version="${tag#v}"
          {
            echo "version=$version"
            echo "stem=gbui-$version-${{ matrix.platform }}"
          } >> "$GITHUB_OUTPUT"

      - name: Build and install
        shell: bash
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=ON \
            -DGBUI_BUILD_TESTS=OFF \
                    -DGBUI_BUILD_DEMOS=OFF \
            -DGBUI_PLATFORM_SDL2=OFF \
            -DCMAKE_INSTALL_LIBDIR=lib \
            -DCMAKE_INSTALL_PREFIX="$PWD/stage/${{ steps.name.outputs.stem }}"
          cmake --build build --config Release --parallel
          cmake --install build --config Release

      # What a person finds when they open the archive. The library cannot say
      # any of this for itself once it is out of the repository.
      - name: Say what is in it
        shell: bash
        env:
          STEM: ${{ steps.name.outputs.stem }}
          VERSION: ${{ steps.name.outputs.version }}
        run: |
          cp LICENSE "stage/$STEM/LICENSE"
          cat > "stage/$STEM/README.md" <<EOF
          # gbui $VERSION — ${{ matrix.platform }}

          A shared build of gbui, its headers, and the CMake package files.

          ## Use it

          Point CMake at this directory and ask for the package:

          \`\`\`sh
          cmake -S . -B build -DCMAKE_PREFIX_PATH=/path/to/$STEM
          \`\`\`

          \`\`\`cmake
          find_package(gbui $VERSION REQUIRED)
          target_link_libraries(my_app PRIVATE gbui::gbui)
          \`\`\`

          That one line carries the include directory and the C++20 requirement
          with it. Everything you write is in the \`gbui\` namespace.

          The library is shared, so it has to be findable at run time: on Linux
          and macOS the linker writes an rpath if you install alongside it, and
          on Windows \`gbui.dll\` goes beside your executable or on \`PATH\`.

          ## No window backend

          This build has no SDL2, because a prebuilt library that links SDL2
          needs the same SDL2 on your machine and that is not a promise a
          download can keep. \`Window::create\` returns nothing here; layout,
          painting, the display list and the SVG painter are all the same code
          as a source build.

          Build from source if you want a window — it is one command, and
          https://gitgusilva.github.io/gbui/guide/installation has it.

          ## Contents

          | | |
          | --- | --- |
          | \`include/gbui/\` | the headers |
          | \`lib/\` | the library, and \`lib/cmake/gbui/\` for \`find_package\` |
          | \`bin/\` | the DLL, on Windows only |

          Licensed under the terms in LICENSE.
          EOF

      # The check the source tree cannot run: everything in it includes the
      # header it wants directly, so an umbrella that stopped exporting a name
      # breaks nothing until somebody consumes an *installed* prefix.
      - name: Consume it, before anybody else has to
        shell: bash
        env:
          STEM: ${{ steps.name.outputs.stem }}
        run: |
          cmake -S tools/consumer -B build/consumer \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$PWD/stage/$STEM"
          cmake --build build/consumer --config Release --parallel
          export PATH="$PWD/stage/$STEM/bin:$PATH"
          if [ -x build/consumer/Release/gbui_consumer.exe ]; then
            build/consumer/Release/gbui_consumer.exe
          else
            build/consumer/gbui_consumer
          fi

      - name: Archive it
        shell: bash
        env:
          STEM: ${{ steps.name.outputs.stem }}
        run: |
          cd stage
          if [ "${{ matrix.archive }}" = "zip" ]; then
            7z a -tzip "$STEM.zip" "$STEM" > /dev/null
          else
            tar czf "$STEM.tar.gz" "$STEM"
          fi
          # Written per platform and concatenated below, because only the runner
          # that built a file can checksum it.
          if command -v sha256sum > /dev/null; then
            sha256sum "$STEM.${{ matrix.archive }}" > "$STEM.sha256"
          else
            shasum -a 256 "$STEM.${{ matrix.archive }}" > "$STEM.sha256"
          fi
          cat "$STEM.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.name.outputs.stem }}
          path: |
            stage/${{ steps.name.outputs.stem }}.${{ matrix.archive }}
            stage/${{ steps.name.outputs.stem }}.sha256
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish ${{ inputs.tag || github.ref_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # A release with no binaries attached is the thing this stopped being. If a
    # platform cannot be built the release does not go out half-dressed.
    needs: package

    steps:
      # The default branch, not the tag — deliberately. The changelog is a
      # cumulative record kept on `main`, so it is the one place that has every
      # released version's section, including a patch cut from its own branch.
      # The tag is read from it below with `git show`, which is what makes the
      # checks below about the tag rather than about today.
      #
      # It also means a tag pushed before any of this existed can still be
      # released: v0.2 predates CHANGELOG.md, and reading the changelog out of
      # that tag would find nothing to say.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Work out what is being released
        id: version
        shell: bash
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          case "$tag" in
            v*) ;;
            *) echo "::error::$tag is not a v-prefixed tag"; exit 1 ;;
          esac
          if ! git rev-parse -q --verify "refs/tags/$tag" > /dev/null; then
            echo "::error::no such tag: $tag"
            exit 1
          fi
          {
            echo "tag=$tag"
            echo "version=${tag#v}"
          } >> "$GITHUB_OUTPUT"

      # The check that "release: 0.3" needed and did not have: a tag was pushed
      # for a version that was not being released, and what said so was a human
      # noticing. CMakeLists.txt is where the version is declared, so the tag
      # and the declaration have to agree, with 0.2 and 0.2.0 read as one
      # version because CMake requires three components and a tag does not.
      - name: The tag and CMakeLists.txt agree
        shell: bash
        run: |
          tag="${{ steps.version.outputs.tag }}"
          declared=$(git show "$tag:CMakeLists.txt" |
            sed -n 's/^[[:space:]]*VERSION[[:space:]]\+\([0-9][0-9.]*\).*/\1/p' | head -n 1)
          if [ -z "$declared" ]; then
            echo "::error::no project VERSION in CMakeLists.txt at $tag"
            exit 1
          fi
          pad() { echo "$1" | awk -F. '{printf "%d.%d.%d\n", $1, $2, $3}'; }
          if [ "$(pad "$declared")" != "$(pad "${{ steps.version.outputs.version }}")" ]; then
            echo "::error::$tag declares version $declared in CMakeLists.txt"
            exit 1
          fi
          echo "$tag declares $declared — agreed."

      - name: Take the notes out of the changelog
        id: notes
        shell: bash
        run: |
          tools/release_notes.sh "${{ steps.version.outputs.version }}" > notes.md
          {
            echo "### Release notes for ${{ steps.version.outputs.tag }}"
            echo
            cat notes.md
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Collect the binaries
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # One SHA256SUMS for the whole release rather than a file each: it is what
      # `sha256sum -c` reads, and four one-line files are four downloads to
      # verify one. The per-platform ones are made where the archives are,
      # because only that runner has them.
      - name: One list of checksums, and the notes that point at it
        shell: bash
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          cd artifacts
          cat ./*.sha256 | sort -k2 > SHA256SUMS
          rm -f ./*.sha256
          ls -l
          cd ..
          {
            echo
            echo "---"
            echo
            echo "### Prebuilt libraries"
            echo
            echo "A shared library, the headers and the CMake package files, for"
            echo "each platform. Unpack one, point \`CMAKE_PREFIX_PATH\` at it and"
            echo "\`find_package(gbui)\` finds it — the archive's README has the"
            echo "three lines. Built **without the SDL2 backend**, because a"
            echo "prebuilt library that links SDL2 needs the same SDL2 on your"
            echo "machine; build from source if you want a window."
            echo
            echo "Verify with \`sha256sum -c SHA256SUMS\`."
          } >> notes.md

      # A tag carrying a suffix — v0.3.0-rc.1 — is not the one people should be
      # sent to by default. Everything else is, including 0.x: this project is
      # pre-1.0 and says so in the changelog, and marking every release a
      # pre-release would leave the repository with no latest release at all.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          prerelease=()
          case "$VERSION" in
            *-*) prerelease=(--prerelease) ;;
          esac

          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG exists — updating its notes."
            gh release edit "$TAG" --title "gbui $VERSION" --notes-file notes.md
          else
            gh release create "$TAG" \
              --title "gbui $VERSION" \
              --notes-file notes.md \
              --verify-tag \
              "${prerelease[@]}"
          fi

          # `--clobber` so a re-run replaces what it uploaded last time instead
          # of failing on a name that already exists — the same reason the step
          # above edits rather than refusing.
          gh release upload "$TAG" artifacts/* --clobber
