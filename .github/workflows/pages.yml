name: Documentation

# Publishes docs/ to GitHub Pages, at https://gitgusilva.github.io/gbui/
#
# The site is a project page, not a user one, so it is served from a
# subdirectory — which VitePress has to be told about at build time, because it
# writes the base into every asset URL and internal link. That is `base`, and
# getting it wrong produces a site whose CSS 404s and whose links all land one
# level too high.
#
# CI already builds the site on every push (as a dead-link check, since
# VitePress fails on one). This workflow is the deploy, and it only runs for
# main.

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "tools/build_docs.sh"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/pages.yml"
      # The site now carries a live demo compiled from the toolkit itself, so
      # a change to either has to republish it.
      - "tools/build_wasm.sh"
      - "demos/**"
      - "include/**"
      - "src/**"
      - "CMakeLists.txt"
  workflow_dispatch:

# Deliberately **not** triggered by tags, though a release is exactly when the
# whole site is rebuilt. A tag push checks out that tag, and `build_docs.sh`
# would then publish *its* `current` at the root — so pushing an old tag would
# quietly replace the live site with an old release's documentation. A release
# already touches `versions.ts`, so the commit on `main` triggers this anyway,
# and by then the tags it archives from are pushed. See the recipe at the top
# of docs/.vitepress/versions.ts.

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time, and a newer one wins: cancel-in-progress here is safe in
# a way it is not for a release, because nothing is uploaded incrementally —
# the artifact is published whole or not at all.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Full history and every tag: an archived version is built from its tag,
      # in a worktree, so a shallow clone would silently publish a version
      # dropdown whose older entries lead nowhere.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 24, not 20: the build script reads the archived list straight out of
      # versions.ts, and stripping types from TypeScript needs a node that can.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: actions/configure-pages@v5
        id: pages

      - run: npm ci

      # ---- the live demo ---------------------------------------------------
      #
      # The six screens on /demos are this repository's own C++, compiled to
      # WebAssembly. The bundle is a build artefact and is not committed, so it
      # is built here — and the faces that travel with it come from the runner,
      # because a browser has no font directory to fall back on.
      - name: Install the faces the demo bundle embeds
        run: sudo apt-get update && sudo apt-get install -y fonts-liberation

      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest
          actions-cache-folder: emsdk-cache

      - name: Build the WebAssembly demos
        run: tools/build_wasm.sh

      - name: Check the bundle is really there
        run: |
          test -s docs/public/demo/gbui-demos.wasm
          test -s docs/public/demo/gbui-demos.data
          test -s docs/public/demo/gbui-embed.js

      # `base` comes from the Pages configuration rather than being hardcoded,
      # so renaming the repository does not silently break every asset URL.
      # VitePress wants the trailing slash that base_path does not carry.
      - name: Resolve the base path
        id: base
        run: |
          path="${{ steps.pages.outputs.base_path }}"
          [ -z "$path" ] && path="/${GITHUB_REPOSITORY#*/}"
          echo "value=${path%/}/" >> "$GITHUB_OUTPUT"

      # Not `npm run docs:build`: that builds the current version alone. This
      # also rebuilds everything in `archived`, each from its tag into its own
      # directory. The absolute URL is what the links between versions use —
      # see docs/.vitepress/versions.ts for why they cannot be relative.
      - name: Build every version
        env:
          GBUI_DOCS_BASE: ${{ steps.base.outputs.value }}
          GBUI_DOCS_SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: tools/build_docs.sh

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
